# Publiceert het ARTO-controlepaneel naar Cloudflare Pages wanneer een fiche of het paneel verandert.
# Nodig in GitHub (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token met "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  account-ID van het ARTO-Cloudflare-account
# Zonder die secrets slaat de workflow het publiceren over.
name: Controlepaneel publiceren

on:
  push:
    paths:
      - "bedrijven/**"
      - "paneel/**"
      - ".github/workflows/paneel.yml"
  workflow_dispatch:

concurrency:
  group: paneel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publiceren:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paneel bouwen
        run: node paneel/build.mjs
      - name: Publiceren
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: paneel
        run: |
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then TAK=main; else TAK=preview; fi
          npx --yes wrangler@4 pages project list | grep -q arto-paneel || npx --yes wrangler@4 pages project create arto-paneel --production-branch=main
          npx --yes wrangler@4 pages deploy --branch="$TAK" --commit-dirty=true
      - name: Geen Cloudflare-secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN ontbreekt, paneel gebouwd maar niet gepubliceerd."
