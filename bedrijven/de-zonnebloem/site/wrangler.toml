# Configuratie voor Cloudflare Pages (statische site + Functions + D1-database).
name = "de-zonnebloem"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "zonnebloem-bestellingen-eu"
# EU-database (jurisdiction eu), aangemaakt 2026-10-29
database_id = "777635f4-80ab-46f3-9c73-d952bfbf5055"

[vars]
# Afzender en ontvanger van e-mails (optioneel, zie lib/mail.js). Leeg = geen e-mails.
MAIL_VAN = ""
MAIL_BEHEER = ""
