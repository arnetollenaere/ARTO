<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
  <title>Beheer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23121215'/%3E%3Cpath d='M12 5.5 18 17H6z' fill='none' stroke='%23ff6a2b' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="/beheer/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/beheer/beheer.css">
  <script>
    // Weergave meteen toepassen, zodat er niets knippert.
    try { var w = JSON.parse(localStorage.getItem('arto-weergave') || 'null'); if (w === 'licht') document.documentElement.dataset.theme = 'light'; else if (w === 'donker') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
    if (!/\/$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
  </script>
  <script type="module" src="/beheer/js/app.js"></script>
</head>
<body>
  <div id="app"><div class="laden"><div class="laden-punt"></div></div></div>
  <div id="meldingen" aria-live="polite" aria-atomic="false"></div>
  <noscript><p style="padding:24px">Het beheerpaneel heeft JavaScript nodig.</p></noscript>
</body>
</html>
